<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة Full Mark الذكية</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input { width: 80%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        ul { list-style: none; padding: 0; margin-top: 20px; }
        li { background: #fff; margin-bottom: 5px; padding: 10px; border-radius: 5px; border-right: 5px solid #28a745; text-align: right; }
    </style>
</head>
<body>

    <div class="card">
        <h2>لوحة تحكم الأكاديمية</h2>
        <p>اكتب هنا لتظهر النتيجة فوراً على الموبايل</p>
        <input type="text" id="contentInput" placeholder="اسم طالب، منشور، أو تنبيه...">
        <br>
        <button id="sendBtn">نشر الآن</button>
    </div>

    <h3>المحتوى المنشور حالياً:</h3>
    <ul id="listContainer"></ul>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore.js";

        // بيانات مشروعك الفريدة
        const firebaseConfig = {
            apiKey: "AIzaSyAxpI-VeuhdnnOyxptnkTsih8qnWAamnrk",
            authDomain: "full-mark-ac-platform.firebaseapp.com",
            projectId: "full-mark-ac-platform",
            storageBucket: "full-mark-ac-platform.firebasestorage.app",
            messagingSenderId: "1023317767710",
            appId: "1:1023317767710:web:a0c2218ccdba946241e00f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // وظيفة الإرسال (تضغط عليها من اللاب توب)
        document.getElementById('sendBtn').onclick = async () => {
            const text = document.getElementById('contentInput').value;
            if(text) {
                await addDoc(collection(db, "fullmark_posts"), {
                    text: text,
                    createdAt: new Date()
                });
                document.getElementById('contentInput').value = "";
            }
        };

        // وظيفة الاستماع (تعرض البيانات تلقائياً على اللاب توب والموبايل)
        const q = query(collection(db, "fullmark_posts"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const container = document.getElementById('listContainer');
            container.innerHTML = "";
            snapshot.forEach((doc) => {
                const li = document.createElement('li');
                li.textContent = doc.data().text;
                container.appendChild(li);
            });
        });
    </script>
</body>
</html>
