<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Mark Platform | السحابية</title>
    
    <!-- استدعاء Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // 1. بيانات مشروعك (انسخها من Firebase Console)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // تهيئة Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // --- نظام الشات اللحظي (مثال للتطبيق الشامل) ---
        window.sendMessage = async () => {
            const msgInput = document.getElementById('chatInput');
            if (msgInput.value.trim() !== "") {
                await addDoc(collection(db, "messages"), {
                    text: msgInput.value,
                    user: currentUser.name,
                    time: Date.now()
                });
                msgInput.value = "";
            }
        };

        // الاستماع للرسائل فور ورودها
        onSnapshot(query(collection(db, "messages"), orderBy("time", "asc")), (snapshot) => {
            const chatBox = document.getElementById('chatMessages');
            chatBox.innerHTML = "";
            snapshot.forEach((doc) => {
                const msg = doc.data();
                chatBox.innerHTML += `<div class="msg-bubble ${msg.user === currentUser.name ? 'mine' : 'theirs'}">
                    <div class="msg-name">${msg.user}</div>
                    ${msg.text}
                </div>`;
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        // --- نظام المنشورات اللحظي ---
        window.publishPost = async () => {
            const postText = document.getElementById('postTextarea').value;
            if(postText) {
                await addDoc(collection(db, "posts"), {
                    content: postText,
                    author: currentUser.name,
                    timestamp: Date.now()
                });
                document.getElementById('postTextarea').value = "";
            }
        };

        onSnapshot(query(collection(db, "posts"), orderBy("timestamp", "desc")), (snapshot) => {
            const feed = document.getElementById('postsFeed');
            feed.innerHTML = "";
            snapshot.forEach((doc) => {
                const post = doc.data();
                feed.innerHTML += `
                    <div class="post-card">
                        <div class="post-header"><strong>${post.author}</strong></div>
                        <div class="post-text">${post.content}</div>
                    </div>`;
            });
        });

    </script>

    <!-- الستايل الخاص بك (تم الإبقاء عليه كما هو لضمان التصميم) -->
    <style>
        /* (ضع هنا كل كود الـ CSS الذي أرسلته لي سابقاً بدون تغيير) */
        :root { --navy: #0d2155; --gold: #b8882a; --white: #ffffff; }
        /* ... باقي الستايل ... */
    </style>
</head>
<body>

<!-- هيكل الـ HTML (تم الإبقاء على نفس معرفات ID لضمان عمل السكربتات) -->
<div id="loginScreen" class="screen active">
    <!-- ... محتوى الدخول ... -->
</div>

<div id="mainScreen" class="screen">
    <!-- التوب بار اللحظي -->
    <div class="top-bar">
        <div class="logo"><span>Full Mark</span></div>
        <div id="onlineStatus">متصل الآن: <span id="userCount">0</span></div>
    </div>

    <!-- منطقة المحتوى -->
    <div class="main-content">
        <div id="homePage" class="page active">
            <div class="create-post-box">
                <textarea id="postTextarea" placeholder="اكتب شيئاً ليراه الجميع فوراً..."></textarea>
                <button onclick="publishPost()" class="btn btn-primary">نشر للكل</button>
            </div>
            <div id="postsFeed"></div>
        </div>

        <!-- الشات الجماعي -->
        <div id="chatPage" class="page">
            <div id="chatMessages" class="chat-messages" style="height: 400px; overflow-y: auto; background: white;"></div>
            <div class="chat-input-row">
                <input type="text" id="chatInput" placeholder="اكتب رسالة...">
                <button onclick="sendMessage()" class="btn btn-primary">إرسال</button>
            </div>
        </div>
    </div>
</div>

<script>
    // وظائف التبديل بين الصفحات
    let currentUser = { name: "مستخدم جديد" };

    function goPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId + 'Page').classList.add('active');
    }

    function doLogin() {
        const user = document.getElementById('loginUser').value;
        if(user) {
            currentUser.name = user;
            document.getElementById('loginScreen').classList.remove('active');
            document.getElementById('mainScreen').classList.add('active');
        }
    }
</script>

</body>
</html>
